name: Validate
on: [push, pull_request]
jobs:
  applications:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codesentinel_test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: backend
      - run: pip install -r ml/requirements.txt
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: python -m unittest discover -s ml -p 'test_*.py'
        working-directory: backend
      - run: npm run migrate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/codesentinel_test
      - run: node --test test/integration.cjs test/http.integration.cjs
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/codesentinel_test
          TEST_REDIS_URL: redis://localhost:6379/1
          PYTHON_EXECUTABLE: python
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: frontend
